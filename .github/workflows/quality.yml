name: Build and deploy Python app to Azure Web App - savannah

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python quality and application dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Type-check Python
        run: python -m mypy .

      - name: Run tests
        run: python -m pytest .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Check Django deployment settings
        run: python manage.py check --deploy
        env:
          DJANGO_SECRET_KEY: pipeline-only-secret-with-at-least-fifty-random-looking-characters-12345
          DJANGO_DEBUG: "false"
          COOKIE_SECURE: "true"
          SECURE_SSL_REDIRECT: "true"
          SECURE_HSTS_SECONDS: "31536000"

      # Keep the artifact compatible with Azure's Oryx remote build. App Service
      # installs requirements.txt when SCM_DO_BUILD_DURING_DEPLOYMENT is enabled.
      - name: Verify production dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install -r requirements.txt

      - name: Upload deployment artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !node_modules/
            !.git/
            !.mypy_cache/
            !.pytest_cache/
            !.ruff_cache/
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: savannah
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_81293AFC178A47D59ABB747DE89AC62D }}
          package: .
